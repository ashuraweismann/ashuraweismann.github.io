name: Blog Agent

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  blog-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            blog-agent/package-lock.json

      - name: Install Astro dependencies
        run: npm ci

      - name: Install Blog Agent dependencies
        working-directory: blog-agent
        run: npm ci

      - name: Run Blog Agent
        working-directory: blog-agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ashuraweismann
          GITHUB_REPO: ashuraweismann.github.io
        run: npm run test